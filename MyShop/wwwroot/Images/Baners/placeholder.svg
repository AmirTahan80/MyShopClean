<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">MyShop demo banner</title>
  <desc id="description">A colorful banner for the MyShop demo storefront.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" rx="32" fill="url(#background)"/>
  <circle cx="1040" cy="90" r="170" fill="#fff" opacity=".08"/>
  <circle cx="1100" cy="440" r="240" fill="#fff" opacity=".06"/>
  <text x="90" y="230" fill="#fff" font-family="Arial, sans-serif" font-size="92" font-weight="700">MyShop</text>
  <text x="95" y="315" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="38">Clean Architecture Store Demo</text>
</svg>
