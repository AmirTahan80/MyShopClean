services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    volumes:
      - myshop-sql-data:/var/opt/mssql
    restart: unless-stopped

  web:
    build:
      context: .
    depends_on:
      - database
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConnectToDataBase: Server=database,1433;Database=MyShop;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
      Payments__Zarinpal__MerchantId: ${ZARINPAL_MERCHANT_ID:-}
      Payments__IdPay__ApiKey: ${IDPAY_API_KEY:-}
      Payments__CallbackBaseUrl: ${PAYMENTS_CALLBACK_BASE_URL:-http://localhost:8080}
      DataProtection__KeysPath: /app/keys
      Database__ApplyMigrationsOnStartup: "true"
      SeedDemoData__Enabled: "true"
    volumes:
      - myshop-data-protection:/app/keys
      - myshop-images:/app/wwwroot/Images
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  myshop-sql-data:
  myshop-data-protection:
  myshop-images:
