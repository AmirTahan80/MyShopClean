services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    volumes:
      - myshop-sql-data:/var/opt/mssql
    ports:
      - "1433:1433"

  web:
    build:
      context: .
    depends_on:
      - database
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConnectToDataBase: Server=database,1433;Database=MyShop;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  myshop-sql-data:
