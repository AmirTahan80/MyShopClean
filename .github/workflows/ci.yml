name: CI

on:
  push:
    branches: [master, NewBr]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MyShopClean.sln
      - run: dotnet build MyShopClean.sln --configuration Release --no-restore
      - run: dotnet test MyShopClean.sln --configuration Release --no-build
      - run: dotnet list MyShopClean.sln package --vulnerable --include-transitive
